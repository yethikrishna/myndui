<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myndui — UI for Modern Interfaces</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', system-ui, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #fff; padding: 2rem; }
.container { max-width: 1200px; width: 100%; display: flex; flex-direction: column; gap: 1rem; align-items: flex-start; }
h1 { font-size: 6rem; font-weight: 900; line-height: 1; letter-spacing: -0.05em; background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.subtitle { font-size: 1.5rem; color: #94a3b8; font-weight: 600; }
.badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 9999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: #cbd5e1; font-size: 0.9rem; }
</style>
</head>
<body>
<div class="container">
  <span class="badge">Mynd Labs · Owned by Yethikrishna R</span>
  <h1>Myndui</h1>
  <p class="subtitle">A UI collection for modern interfaces — rebuilt from the core outward.</p>
</div>
</body>
</html>
